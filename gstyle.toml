[guard.comments]
mode = "added"

[patterns]
similarity_threshold = 80
min_coverage = 80

[patterns.measurements]
min_source_lines = 3
min_function_calls = 2

[[guard.files]]
id = "python_outside_lean"
extensions = [".py", ".pyi", ".pyw", ".pyc", ".pyo", ".ipynb"]
allow_directories = ["verification/lean"]

[[guard.files]]
id = "nested_readme"
mode = "added"
names = ["README.md"]
allow_paths = ["README.md"]

[risk]
pdg_change = "medium"
pdg_low_risk_max_functions = 3
dependency_change = "high"
api_breaking = "high"

[[risk.calls]]
callee = "os.WriteFile"
level = "high"

[[risk.calls]]
callee = "os.RemoveAll"
level = "high"

[[overrides]]
paths = ["adapters"]
weights = { io = 0, network = 0 }
