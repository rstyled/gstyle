[guard.comments]
mode = "added"

[[guard.files]]
id = "python_outside_lean"
extensions = [".py", ".pyi", ".pyw", ".pyc", ".pyo", ".ipynb"]
allow_directories = ["verification/lean"]

[[guard.files]]
id = "nested_readme"
mode = "added"
names = ["README.md"]
allow_paths = ["README.md"]

[risk]
pdg_change = "medium"
dependency_change = "high"

[[risk.calls]]
callee = "os.WriteFile"
level = "high"

[[risk.calls]]
callee = "os.RemoveAll"
level = "high"
