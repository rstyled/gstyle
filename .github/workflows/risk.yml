name: Merge risk

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-gate:
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.text }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the description report
        run: |
          printf '%s\n\n%s\n' '**Merge risk: unavailable ⚠️**' \
            'See the failed step in the Actions run.' \
            > "$RUNNER_TEMP/merge-risk.md"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the trusted base analyzer
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/gstyle-risk" .
          if ! timeout 10s "$RUNNER_TEMP/gstyle-risk" help risk | grep -qE '(^|[[:space:]])--check([[:space:]]|$)'; then
            echo '::error::The trusted base has no usable risk --check command.'
            exit 1
          fi

      - name: Fetch the exact candidate commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"

      - name: Require low merge risk
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          risk_exit=0
          "$RUNNER_TEMP/gstyle-risk" risk \
            --base "$PR_BASE" --head "$PR_HEAD" --check \
            > "$RUNNER_TEMP/measured-risk.md" || risk_exit=$?
          if test "$risk_exit" -le 1; then
            test -s "$RUNNER_TEMP/measured-risk.md"
            cp "$RUNNER_TEMP/measured-risk.md" "$RUNNER_TEMP/merge-risk.md"
          fi
          exit "$risk_exit"

      - name: Pass the report to the description job
        id: report
        if: always()
        run: |
          printf 'text=%s\n' "$(jq -cRs . < "$RUNNER_TEMP/merge-risk.md")" >> "$GITHUB_OUTPUT"

  publish:
    needs: risk-gate
    if: >-
      !cancelled() && needs.risk-gate.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the PR description
        uses: actions/github-script@v8
        env:
          RISK_REPORT_JSON: ${{ needs.risk-gate.outputs.report }}
        with:
          script: |
            const { number, base: { sha: base }, head: { sha: head } } = context.payload.pull_request;
            const report = JSON.parse(process.env.RISK_REPORT_JSON).trimEnd()
              .replace(/^(\*\*Code impact:\*\* [^\n]*?) · /m, '$1  \n')
              .replace(/^\d+ root-module packages \(current build\)\.\n?/m, '');
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pull.state !== 'open' || pull.head.sha !== head || pull.base.sha !== base ||
                pull.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Skip closed PR or stale comparison');
              return;
            }
            const startMarker = '<!-- gstyle:merge-risk:start -->';
            const endMarker = '<!-- gstyle:merge-risk:end -->';
            if (!report || report.includes(startMarker) || report.includes(endMarker)) {
              throw new Error('Report is empty or contains reserved markers');
            }
            const body = pull.body || '';
            const start = body.indexOf(startMarker);
            const end = body.indexOf(endMarker);
            const block = [startMarker, report, '',
              `Compared base: \`${base}\` · head: \`${head}\``,
              endMarker].join('\n');
            let updated;
            if (start === -1 && end === -1) {
              updated = body + (body ? '\n\n' : '') + block;
            } else if (start >= 0 && end > start &&
                       body.indexOf(startMarker, start + startMarker.length) === -1 &&
                       body.indexOf(endMarker, end + endMarker.length) === -1) {
              updated = body.slice(0, start) + block + body.slice(end + endMarker.length);
            } else {
              throw new Error('Description contains incomplete or duplicate report markers');
            }
            if (Buffer.byteLength(updated, 'utf8') > 65536) {
              throw new Error('Report exceeds the PR description limit');
            }
            if (updated !== body) {
              await github.rest.pulls.update({ ...context.repo, pull_number: number, body: updated });
            }
