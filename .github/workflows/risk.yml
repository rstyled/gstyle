name: Merge risk

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the description report
        run: |
          mkdir -p "$RUNNER_TEMP/merge-risk-report"
          jq '{number: .number, base: .pull_request.base.sha, head: .pull_request.head.sha}' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/merge-risk-report/metadata.json"
          printf '%s\n\n%s\n' '**Merge risk: unavailable ⚠️**' \
            'See the failed step in the Actions run.' \
            > "$RUNNER_TEMP/merge-risk-report/merge-risk.md"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the trusted base analyzer
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/gstyle-risk" .
          if ! timeout 10s "$RUNNER_TEMP/gstyle-risk" help risk | grep -qE '(^|[[:space:]])--check([[:space:]]|$)'; then
            echo '::error::The trusted base has no usable risk --check command.'
            exit 1
          fi

      - name: Fetch the exact candidate commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"

      - name: Require low merge risk
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          risk_exit=0
          "$RUNNER_TEMP/gstyle-risk" risk \
            --base "$PR_BASE" --head "$PR_HEAD" --check \
            > "$RUNNER_TEMP/merge-risk.md" || risk_exit=$?
          if test "$risk_exit" -le 1; then
            test -s "$RUNNER_TEMP/merge-risk.md"
            cp "$RUNNER_TEMP/merge-risk.md" "$RUNNER_TEMP/merge-risk-report/merge-risk.md"
          fi
          exit "$risk_exit"

      - name: Transfer the description report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-risk-report
          path: ${{ runner.temp }}/merge-risk-report/
          if-no-files-found: error
          retention-days: 1
