name: CI

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: make test

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test with race detector
        run: make test-race

  gstyle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Dogfood gstyle on itself
        run: make gstyle-check

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Quality gate
        run: make quality-gate

  verify-core:
    name: Lean / ${{ matrix.profile }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: function-length
            target: verify-length
            shard: 0/1
          - profile: pdg-queries
            target: verify-pdg
            shard: 0/1
          - profile: unchecked-output
            target: verify-output
            shard: 0/3
          - profile: unchecked-output
            target: verify-output
            shard: 1/3
          - profile: unchecked-output
            target: verify-output
            shard: 2/3
          - profile: negative-index
            target: verify-negative-index
            shard: 0/4
          - profile: negative-index
            target: verify-negative-index
            shard: 1/4
          - profile: negative-index
            target: verify-negative-index
            shard: 2/4
          - profile: negative-index
            target: verify-negative-index
            shard: 3/4
          - profile: runtime-value
            target: verify-runtime-value
            shard: 0/2
          - profile: runtime-value
            target: verify-runtime-value
            shard: 1/2
          - profile: state-map
            target: verify-state-map
            shard: 0/2
          - profile: state-map
            target: verify-state-map
            shard: 1/2
          - profile: numeric-transfer
            target: verify-numeric-transfer
            shard: 0/3
          - profile: numeric-transfer
            target: verify-numeric-transfer
            shard: 1/3
          - profile: numeric-transfer
            target: verify-numeric-transfer
            shard: 2/3
          - profile: signed-step
            target: verify-signed-step
            shard: 0/2
          - profile: signed-step
            target: verify-signed-step
            shard: 1/2
          - profile: assignment
            target: verify-assignment
            shard: 0/2
          - profile: assignment
            target: verify-assignment
            shard: 1/2
          - profile: branch-composition
            target: verify-branch
            shard: 0/2
          - profile: branch-composition
            target: verify-branch
            shard: 1/2
          - profile: pdg-text
            target: verify-pdg-text
            shard: 0/1
          - profile: operator-availability
            target: verify-operator
            shard: 0/1
          - profile: pdg-list
            target: verify-pdg-list
            shard: 0/1
          - profile: pdg-attributes
            target: verify-pdg-attributes
            shard: 0/2
          - profile: pdg-attributes
            target: verify-pdg-attributes
            shard: 1/2
          - profile: runtime-facts
            target: verify-runtime-facts
            shard: 0/2
          - profile: runtime-facts
            target: verify-runtime-facts
            shard: 1/2
          - profile: value-evaluation
            target: verify-value-evaluation
            shard: 0/3
          - profile: value-evaluation
            target: verify-value-evaluation
            shard: 1/3
          - profile: value-evaluation
            target: verify-value-evaluation
            shard: 2/3
          - profile: comparison
            target: verify-comparison
            shard: 0/4
          - profile: comparison
            target: verify-comparison
            shard: 1/4
          - profile: comparison
            target: verify-comparison
            shard: 2/4
          - profile: comparison
            target: verify-comparison
            shard: 3/4
          - profile: one-sided
            target: verify-one-sided
            shard: 0/1
          - profile: shared-flow
            target: verify-shared-flow
            shard: 0/1
          - profile: assume
            target: verify-assume
            shard: 0/1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Restore pinned Lean dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan/toolchains
            verification/length/.lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/length/lean-toolchain', 'verification/length/lakefile.toml', 'verification/length/lake-manifest.json') }}

      - name: Restore incremental project build
        uses: actions/cache@v5
        with:
          path: verification/length/.lake/build
          key: lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/length/lean-toolchain', 'verification/length/lakefile.toml', 'verification/length/lake-manifest.json') }}-${{ hashFiles('verification/length/Gstyle.lean', 'verification/length/Gstyle/**/*.lean') }}
          restore-keys: |
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/length/lean-toolchain', 'verification/length/lakefile.toml', 'verification/length/lake-manifest.json') }}-

      - name: Install pinned Lean toolchain manager
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify ${{ matrix.profile }} source, proofs, axioms and mutations
        env:
          GSTYLE_MUTATION_SHARD: ${{ matrix.shard }}
        run: make ${{ matrix.target }}

      - name: Preserve proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-proof-${{ strategy.job-index }}
          path: |
            dist/verification/${{ matrix.profile }}/*.log
            dist/verification/${{ matrix.profile }}/result.json

  # Preserve the existing required check name while all profiles run in parallel.
  verify-length:
    needs: verify-core
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Lean profile to pass
        env:
          PROOF_RESULT: ${{ needs.verify-core.result }}
        run: test "$PROOF_RESULT" = success
