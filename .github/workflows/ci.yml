name: CI

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Enforce repository policy
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make guard

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: make test

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore race build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-race-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Test with race detector
        run: make test-race

  gstyle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Dogfood gstyle on itself
        run: make gstyle-check

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Quality gate
        run: make quality-gate

  verify-programs:
    name: Lean / exhaustive scalar programs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Restore pinned Lean dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan/toolchains
            verification/lean/.lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}

      - name: Restore incremental program-contract build
        uses: actions/cache@v5
        with:
          path: verification/lean/.lake/build
          key: lean-programs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-${{ hashFiles('verification/lean/Gstyle.lean', 'verification/lean/Gstyle/**/*.lean') }}
          restore-keys: |
            lean-programs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-

      - name: Install pinned Lean toolchain manager
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Certify source-to-range results and reject controls
        run: |
          make verify-programs
          make verify-branches

      - name: Preserve program certificates and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalar-program-certificates
          path: |
            dist/verification/programs/
            dist/verification/branches/

  verify-cache:
    name: Lean / source, axioms and cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cached.outputs.matrix }}
      has-misses: ${{ steps.cached.outputs.has-misses }}
      has-hits: ${{ steps.cached.outputs.has-hits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Restore pinned Lean dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan/toolchains
            verification/lean/.lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}

      - name: Restore incremental project build
        uses: actions/cache@v5
        with:
          path: verification/lean/.lake/build
          key: lean-preflight-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-${{ hashFiles('verification/lean/Gstyle.lean', 'verification/lean/Gstyle/**/*.lean') }}
          restore-keys: |
            lean-profile-v2-function-length-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-

      - name: Restore combined mutation evidence
        uses: actions/cache/restore@v5
        with:
          path: dist/mutation-cache
          key: lean-mutation-bundle-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            lean-mutation-bundle-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned Lean toolchain manager
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check cached proofs and select fresh controls
        id: cached
        env:
          GSTYLE_MUTATION_WORKERS: '4'
        run: |
          python3 -B -m unittest discover -s verification/lean -p 'test_*.py'
          python3 -B verification/lean/ci_cached.py

      - name: Preserve checked cache hits
        if: steps.cached.outputs.has-hits == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cached-proof-hits
          path: dist/mutation-cache-hits/

      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-audit-evidence
          path: |
            dist/verification/preflight/**/*.log
            dist/verification/preflight/**/result.json

  verify-core:
    name: Lean / ${{ matrix.profile }} / ${{ matrix.shard }}
    needs: verify-cache
    if: needs.verify-cache.outputs.has-misses == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-cache.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Restore pinned Lean dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan/toolchains
            verification/lean/.lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}

      - name: Restore incremental project build
        uses: actions/cache@v5
        with:
          path: verification/lean/.lake/build
          key: lean-profile-v2-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-${{ hashFiles('verification/lean/Gstyle.lean', 'verification/lean/Gstyle/**/*.lean') }}
          restore-keys: |
            lean-profile-v2-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-

      - name: Restore mutation evidence
        uses: actions/cache@v5
        with:
          path: dist/mutation-cache/${{ matrix.cache-index }}
          key: lean-mutations-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache-index }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            lean-mutations-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache-index }}-

      - name: Install pinned Lean toolchain manager
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify ${{ matrix.profile }} source, proofs, axioms and mutations
        env:
          GSTYLE_MUTATION_SHARD: ${{ matrix.shard }}
          GSTYLE_MUTATION_WORKERS: '4'
          GSTYLE_MUTATION_CACHE: ${{ github.workspace }}/dist/mutation-cache/${{ matrix.cache-index }}
        run: make ${{ matrix.target }}

      - name: Preserve proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-proof-${{ matrix.cache-index }}
          path: |
            dist/verification/${{ matrix.profile }}/*.log
            dist/verification/${{ matrix.profile }}/*.json

  # Preserve the required check name and require fresh checks or exact evidence.
  verify-length:
    needs: [verify-cache, verify-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Lean profile to pass
        env:
          CACHE_RESULT: ${{ needs.verify-cache.result }}
          PROOF_RESULT: ${{ needs.verify-core.result }}
          HAS_MISSES: ${{ needs.verify-cache.outputs.has-misses }}
        run: |
          test "$CACHE_RESULT" = success
          if [ "$HAS_MISSES" = true ]; then
            test "$PROOF_RESULT" = success
          else
            test "$HAS_MISSES" = false
            test "$PROOF_RESULT" = skipped
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified proof evidence
        uses: actions/download-artifact@v4
        with:
          pattern: '*proof*'
          path: dist/proof-artifacts

      - name: Assemble complete mutation cache
        run: python3 -B verification/lean/ci_evidence.py

      - name: Save combined mutation evidence
        uses: actions/cache/save@v5
        with:
          path: dist/mutation-cache
          key: lean-mutation-bundle-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}

  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            verification/sarif/go.sum
      - name: Validate SARIF output against OASIS schema
        run: make verify-sarif

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify labeled SAST source baseline
        run: make verify-sast
