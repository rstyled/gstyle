name: Merge risk description

"on":
  workflow_run:
    workflows: [Merge risk]
    types: [completed]

permissions:
  actions: write
  pull-requests: write

concurrency:
  group: risk-description-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/risk.yml' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the source run report outside the checkout
        uses: actions/download-artifact@v4
        with:
          name: merge-risk-report
          path: ${{ runner.temp }}/merge-risk-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the PR description
        uses: actions/github-script@v8
        env:
          RISK_REPORT_DIR: ${{ runner.temp }}/merge-risk-report
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const read = name => {
              const file = path.join(process.env.RISK_REPORT_DIR, name);
              if (!fs.lstatSync(file).isFile()) throw new Error(`${name} must be a regular file`);
              return fs.readFileSync(file, 'utf8');
            };
            const metadata = JSON.parse(read('metadata.json'));
            const report = read('merge-risk.md').trimEnd();
            const run = context.payload.workflow_run;
            const sha = /^[a-f0-9]{40}$/;
            if (!Number.isSafeInteger(metadata.number) || metadata.number < 1 ||
                !sha.test(metadata.base) || !sha.test(metadata.head) || metadata.head !== run.head_sha) {
              throw new Error('Report metadata does not match the source run');
            }
            const pulls = run.pull_requests.length ? run.pull_requests : await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: run.head_sha, per_page: 100 }
            );
            if (!pulls.some(pull => pull.number === metadata.number)) {
              throw new Error('Report PR is not associated with the source run');
            }
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: metadata.number });
            if (pull.state !== 'open' || pull.head.sha !== metadata.head || pull.base.sha !== metadata.base ||
                pull.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Skip closed PR or stale comparison');
              return;
            }
            const startMarker = '<!-- gstyle:merge-risk:start -->';
            const endMarker = '<!-- gstyle:merge-risk:end -->';
            if (!report || report.includes(startMarker) || report.includes(endMarker)) {
              throw new Error('Report is empty or contains reserved markers');
            }
            const body = pull.body || '';
            const start = body.indexOf(startMarker);
            const end = body.indexOf(endMarker);
            const block = [startMarker, report, '',
              `Compared base: \`${metadata.base}\` · head: \`${metadata.head}\``,
              endMarker].join('\n');
            let updated;
            if (start === -1 && end === -1) {
              updated = body + (body ? '\n\n' : '') + block;
            } else if (start >= 0 && end > start &&
                       body.indexOf(startMarker, start + startMarker.length) === -1 &&
                       body.indexOf(endMarker, end + endMarker.length) === -1) {
              updated = body.slice(0, start) + block + body.slice(end + endMarker.length);
            } else {
              throw new Error('Description contains incomplete or duplicate report markers');
            }
            if (Buffer.byteLength(updated, 'utf8') > 65536) {
              throw new Error('Report exceeds the PR description limit');
            }
            if (updated !== body) {
              await github.rest.pulls.update({ ...context.repo, pull_number: metadata.number, body: updated });
            }

      - name: Delete the transferred report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name !== 'merge-risk-report') continue;
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
            }
