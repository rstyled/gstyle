name: Merge risk description

"on":
  workflow_run:
    workflows: [Merge risk]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: risk-description-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/risk.yml' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the trusted publisher
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
          no-cache: true

      - name: Download the source run report outside the checkout
        uses: actions/download-artifact@v4
        with:
          name: merge-risk-report
          path: ${{ runner.temp }}/merge-risk-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the PR description
        run: bun .github/scripts/publish-risk.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RISK_REPORT_DIR: ${{ runner.temp }}/merge-risk-report
