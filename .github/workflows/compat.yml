name: PDG compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      gstyle_ref:
        description: Go ref override; empty tests the selected workflow commit
        type: string
      rstyle_ref:
        description: Rust branch, tag or commit
        default: main
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    uses: rstyled/compat/.github/workflows/compat.yml@952c016a592e2ab53a5e4b23b6e9046c9cabe182
    with:
      compat_ref: 952c016a592e2ab53a5e4b23b6e9046c9cabe182
      gstyle_ref: ${{ inputs.gstyle_ref || github.sha }}
      rstyle_ref: ${{ inputs.rstyle_ref || 'main' }}
